<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVII — Цифровая платформа</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0D9488 0%, #0F766E 50%, #115E59 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .splash {
            text-align: center;
            color: white;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: white;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .logo-icon svg {
            width: 70px;
            height: 70px;
        }

        .logo-text {
            display: none;
        }

        .logo-name {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .logo-tagline {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.9;
            letter-spacing: 2px;
        }

        .links {
            margin-top: 60px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .links a:hover {
            background: white;
            color: #0D9488;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .logo-icon {
                width: 100px;
                height: 100px;
                border-radius: 24px;
                margin-bottom: 25px;
            }

            .logo-icon svg {
                width: 55px;
                height: 55px;
            }

            .logo-name {
                font-size: 3rem;
                letter-spacing: 3px;
            }

            .logo-tagline {
                font-size: 1rem;
            }

            .links {
                flex-direction: column;
                gap: 15px;
                margin-top: 50px;
            }

            .links a {
                padding: 14px 40px;
            }
        }

        @media (max-width: 480px) {
            .logo-icon {
                width: 90px;
                height: 90px;
                border-radius: 22px;
            }

            .logo-icon svg {
                width: 50px;
                height: 50px;
            }

            .logo-name {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="splash">
        <div class="logo-icon">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 10L75 25V40L50 55L25 40V25L50 10Z" fill="#0D9488"/>
                <path d="M50 45L75 60V75L50 90L25 75V60L50 45Z" fill="#14B8A6"/>
                <path d="M25 40L50 55V75L25 60V40Z" fill="#0F766E"/>
                <path d="M75 40V60L50 75V55L75 40Z" fill="#0F766E"/>
                <circle cx="50" cy="50" r="12" fill="white"/>
            </svg>
        </div>
        <div class="logo-name">LOVII</div>
        <div class="logo-tagline">Цифровая платформа локальной экономики</div>
        <div class="links">
            <a href="https://aoplatforma.ru" target="_blank">Платформа</a>
            <a href="https://bestdeejay-design.github.io/lovii_presentation/">Для инвесторов</a>
        </div>
    </div>
</body>
</html>
